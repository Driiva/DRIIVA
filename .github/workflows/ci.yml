name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The web design laws need a browser and a dev server, so they cannot run
      # here. The mobile laws are a static source lint for exactly that reason.
      - name: Mobile design laws
        run: npm run design:laws:mobile

      # Static sweep for invented money, people and regulatory claims on the
      # web surfaces. Every hit is either deleted or acknowledged by name.
      - name: Fabrication laws
        run: npm run fabrication:laws

  build:
    name: Build (client + server)
    runs-on: ubuntu-latest
    # Fake Firebase env vars so Vite can build without real credentials
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_PROJECT_ID: driiva
      VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build
        run: npm run build

  functions-build:
    name: Build (Cloud Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # functions/tsconfig.json path-maps @driiva/contracts to
      # contracts/dist/index.d.ts (M1 T7 fix, mirrors packages/scoring's own
      # tsconfig), so contracts must be built before functions can build -
      # same coupling the "packages" job already documents for scoring.
      - name: Install root dependencies
        run: npm ci

      - name: Build @driiva/contracts
        run: npm run build --prefix packages/contracts

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Test functions
        run: npm test
        working-directory: functions

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 22, not 20, for this job only: dev-deps bump #63 brought jsdom 30,
      # which pulls undici 8 (engines: node >=22.19.0). On Node 20 the whole
      # suite dies at import with "webidl.util.markAsUncloneable is not a
      # function". The Cloud Functions jobs stay on 20 so the deployed runtime
      # is unchanged; this pin only affects the test runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # vitest.config.ts includes functions/src/**/*.test.ts in the root suite,
      # and provisionUserOnSignup.ts imports firebase-functions at module scope.
      # Without functions' own dependencies that import cannot resolve, so the
      # suite failed here with "Failed to resolve import firebase-functions"
      # while passing for anyone who had run npm ci in functions/ locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

  packages:
    name: Packages (contracts + scoring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Type check @driiva/contracts
        run: npx tsc -p packages/contracts/tsconfig.json --noEmit

      # scoring's tsconfig path-maps @driiva/contracts to contracts/dist/index.d.ts,
      # so contracts must be built before scoring can be typechecked. build:packages
      # makes that order explicit so a future reorder can't silently break it.
      - name: Build packages (contracts, then scoring)
        run: npm run build:packages

      - name: Type check @driiva/scoring
        run: npx tsc -p packages/scoring/tsconfig.json --noEmit

  rules-emulator:
    name: Firestore Rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The rules suite runs under `firebase emulators:exec`, which needs a JRE.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Run Firestore rules suite (emulator)
        run: npm run test:rules

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Characterisation E2E runs the real dev server against the STAGING Firebase
    # project (see playwright.config.ts). A ci-placeholder Firebase config was
    # tried first and breaks 3 specs (invalid API key surfaces as an unhandled
    # console error on every page load, and wrong Firebase error codes on the
    # signup/demo characterisation specs) so this job reuses the same staging
    # secrets deploy-staging/deploy-production already read.
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      # None of the runnable (non-skipped) specs hit a DB-backed route, but
      # server/db.ts throws at import time if this is unset or not postgres-
      # shaped, so a placeholder unblocks the dev server boot without a real DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer hardcodes `npm run dev:staging`, which
      # in turn hardcodes `--env-file=.env.staging`. That file is gitignored and
      # doesn't exist on the runner, so letting Playwright spawn it fresh would
      # fail outright. Write a CI-only copy from the env above instead.
      - name: Write .env.staging for CI
        run: |
          cat > .env.staging <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
          DATABASE_URL=${DATABASE_URL}
          EOF

      # Start the server explicitly rather than relying on Playwright's own
      # webServer command: it needs to be up before we know .env.staging (just
      # written above) is actually being picked up correctly.
      - name: Start dev server (staging mode, backgrounded)
        run: |
          nohup env PORT=4310 npm run dev:staging > dev-server.log 2>&1 &
          echo "Dev server starting in background"

      - name: Wait for dev server
        run: |
          for _i in $(seq 1 60); do
            if curl -sf http://localhost:4310/api/health > /dev/null; then
              echo "Dev server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server did not become healthy in time"
          cat dev-server.log
          exit 1

      # reuseExistingServer: true in playwright.config.ts means Playwright
      # reuses the server started above instead of spawning its own.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build, functions-build, test, packages, rules-emulator, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # ── Staging Firebase config (from GitHub Secrets) ────────────────────
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_FEATURE_AI_INSIGHTS: "true"
      VITE_FEATURE_COMMUNITY_POOL: "true"
      VITE_FEATURE_LEADERBOARD: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      # Build client with staging Firebase config (VITE_* vars injected above)
      - name: Build client (staging)
        run: npm run build:staging

      # ── Firebase ──────────────────────────────────────────────────────────
      # Deploys Firestore rules, indexes, and Cloud Functions to driiva-staging.
      # Requires: FIREBASE_TOKEN secret set in GitHub → Settings → Secrets.
      # Cloud Functions require the driiva-staging project to be on the Blaze plan.
      # If not yet upgraded, change --only to: firestore:rules,firestore:indexes
      # TODO: Create staging Firebase project and add FIREBASE_TOKEN to GitHub Secrets
      - name: Deploy Firebase to staging
        run: |
          npx firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project staging \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # ── Vercel ────────────────────────────────────────────────────────────
      # Deploys the pre-built client + Express serverless function to Vercel.
      # Requires these GitHub Secrets:
      #   VERCEL_TOKEN            : from vercel.com/account/tokens
      #   VERCEL_ORG_ID           : from .vercel/project.json or Vercel dashboard
      #   VERCEL_PROJECT_ID_STAGING : Vercel project ID for the staging project
      # Runtime env vars (DATABASE_URL, ANTHROPIC_API_KEY etc.) must be set in
      # the Vercel staging project's Environment Variables settings.
      # TODO: Create staging Firebase project and add FIREBASE_TOKEN to GitHub Secrets
      - name: Deploy to Vercel (staging)
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}

  # ═══════════════════════════════════════════════════════════════════════════
  # PRODUCTION DEPLOY
  # ═══════════════════════════════════════════════════════════════════════════
  # Runs when:
  #   1. You manually trigger "Run workflow" → pick "production" from dropdown
  #   2. You push a git tag like v1.0.0
  #
  # Requires the "production" GitHub Environment to be set up:
  #   GitHub → Settings → Environments → New → "production"
  #   → Add yourself as Required Reviewer
  #   → This gives you a "Review deployments" approval button before it goes live
  #
  # Required GitHub Secrets (set in the "production" environment):
  #   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_PRODUCTION
  #   FIREBASE_TOKEN (for deploying rules + functions to production Firebase)
  #   All VITE_FIREBASE_* vars for the production Firebase project
  #   VITE_SENTRY_DSN (production Sentry DSN)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build, functions-build, test, packages, rules-emulator, e2e]
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production')
      || startsWith(github.ref, 'refs/tags/v')
    environment: production
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_FEATURE_AI_INSIGHTS: "true"
      VITE_FEATURE_COMMUNITY_POOL: "true"
      VITE_FEATURE_LEADERBOARD: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Build client (production)
        run: npm run build

      # Deploy Firestore rules, indexes, and Cloud Functions to production
      - name: Deploy Firebase to production
        run: |
          npx firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project default \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Deploy client + Express server to production Vercel project
      - name: Deploy to Vercel (production)
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
