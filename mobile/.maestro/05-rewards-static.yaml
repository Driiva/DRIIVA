# MOB-T11 - rewards tab.
#
# This flow used to STUB-LOCK a static 5-tier list of named partner vouchers
# (Tesco, RAC, Halfords, Nectar, Amazon), every item permanently locked. Wave 0
# (0a/0c) deleted them: no partnership backed any of those values. The tab now
# states where the programme actually is, so this flow asserts the named
# brands are gone rather than pinning them in place.
appId: com.driiva.app
---
- launchApp
- tapOn: "Rewards"
- assertVisible: ".*[Rr]ewards.*"
- assertNotVisible: ".*Tesco.*"
- assertNotVisible: ".*Amazon.*"
- assertVisible: ".*not live yet.*"
